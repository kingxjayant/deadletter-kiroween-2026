name: CI — tests, properties, build, compliance

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Unit + property-based + DOM smoke tests
        run: npm test
      - name: Correctness properties only (explicit evidence for judges)
        run: npm run test:pbt
      - name: Build static app
        run: npm run build
      - name: Kiroween Official Rules compliance gate
        run: npm run audit:submission
      - name: MCP server smoke test
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"encode_message","arguments":{"message":"CI round trip","k":4,"n":7}}}' \
            | node tools/mcp/deadletter-mcp.mjs | head -3
      - name: Upload built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadletter-site
          path: public/
